name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'nighthawk-dev'
    outputs:
      packages_published: ${{ steps.changesets.outputs.published }}
      nighthawk_native_release: ${{ steps.nighthawk-release.outputs.should_publish }}
      nighthawk_release_tag: ${{ steps.nighthawk-release.outputs.tag }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Required for NPM Trusted Publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate NightHawk built-in catalog
        shell: bash
        run: |
          CATALOG_FILE="$RUNNER_TEMP/nighthawk-built-in-catalog.json"
          node apps/nighthawk/scripts/update-catalog.mjs --out "$CATALOG_FILE"
          echo "NIGHTHAWK_BUILT_IN_CATALOG_FILE=$CATALOG_FILE" >> "$GITHUB_ENV"

      - name: Build packages
        run: pnpm build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm run version:release
          commit: "ci: release packages"
          title: "ci: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN is not needed with Trusted Publishing (OIDC)

      - name: Resolve NightHawk native release
        if: steps.changesets.outputs.published == 'true'
        id: nighthawk-release
        run: node apps/nighthawk/scripts/native/resolve-release.mjs
        env:
          CHANGESETS_PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}

  deploy-docs:
    name: Deploy docs
    needs: release
    if: needs.release.outputs.packages_published == 'true'
    uses: ./.github/workflows/docs-deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  native-artifacts:
    name: Native release artifact
    needs: release
    if: needs.release.outputs.nighthawk_native_release == 'true'
    uses: ./.github/workflows/_native-build.yml
    with:
      upload-artifact-prefix: nighthawk-native
      retention-days: 7
      sign-macos: true
    secrets:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}

  publish-native-assets:
    name: Publish native release assets
    needs:
      - release
      - native-artifacts
    if: needs.release.outputs.nighthawk_native_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: nighthawk-native-*
          path: dist-native-release
          merge-multiple: true

      - name: Produce manifest.json
        env:
          RELEASE_TAG: ${{ needs.release.outputs.nighthawk_release_tag }}
        run: node apps/nighthawk/scripts/native/produce-manifest.mjs dist-native-release "$RELEASE_TAG"

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.nighthawk_release_tag }}
        run: gh release upload "$RELEASE_TAG" dist-native-release/* --clobber

  publish-brew:
    name: Publish Homebrew formula
    needs:
      - release
      - native-artifacts
    if: needs.release.outputs.nighthawk_native_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: nighthawk-native-*
          path: dist-native-release
          merge-multiple: true

      - name: Produce manifest.json
        env:
          RELEASE_TAG: ${{ needs.release.outputs.nighthawk_release_tag }}
        run: node apps/nighthawk/scripts/native/produce-manifest.mjs dist-native-release "$RELEASE_TAG"

      - name: Generate Homebrew formula
        env:
          RELEASE_TAG: ${{ needs.release.outputs.nighthawk_release_tag }}
        run: node apps/nighthawk/scripts/native/update-brew-formula.mjs dist-native-release/manifest.json --out nighthawk.rb

      - name: Push formula to homebrew-nighthawk tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.nighthawk_release_tag }}
        run: |
          VERSION="${RELEASE_TAG#*@}"
          VERSION="${VERSION#v}"
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/nighthawk-dev/homebrew-nighthawk.git" tap
          cp nighthawk.rb "tap/nighthawk.rb"
          cd tap
          git config user.name "nighthawk-bot"
          git config user.email "nighthawk-bot@users.noreply.github.com"
          git add nighthawk.rb
          git diff --cached --quiet || git commit -m "Update NightHawk formula to ${VERSION}"
          git push
        shell: bash
