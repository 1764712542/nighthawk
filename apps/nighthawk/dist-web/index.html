<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NightHawk — Cosmic Terminal</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #000013;
    --surface: #0b0b24;
    --surface-hover: #12123a;
    --border: #1a1a4a;
    --text: #f3f3f3;
    --text-dim: #7a7aaa;
    --accent: #6c6cff;
    --accent-glow: #6c6cff66;
    --green: #4aff8a;
    --red: #ff4a6a;
    --yellow: #ffcc4a;
    --sidebar-w: 280px;
    --header-h: 48px;
    --status-h: 32px;
    --radius: 8px;
  }

  body {
    font-family: 'Courier New', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* ── Geometric SVG decorations ── */
  .bg-decor {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    opacity: 0.06;
  }
  .bg-decor.hex1 {
    top: -80px; right: -60px;
    width: 320px; height: 320px;
  }
  .bg-decor.hex2 {
    bottom: 60px; left: -50px;
    width: 240px; height: 240px;
    opacity: 0.04;
  }
  .bg-decor.poly1 {
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 600px; height: 600px;
    opacity: 0.025;
  }

  /* ── Layout ── */
  .app-layout {
    display: flex;
    flex: 1;
    position: relative;
    z-index: 1;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .sidebar-header h2 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .sidebar-header .new-btn {
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: inherit;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s;
  }
  .sidebar-header .new-btn:hover {
    background: var(--accent);
    color: #fff;
  }
  .convo-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .convo-list::-webkit-scrollbar { width: 4px; }
  .convo-list::-webkit-scrollbar-track { background: transparent; }
  .convo-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .convo-item {
    padding: 10px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
    transition: background 0.12s;
    border: 1px solid transparent;
  }
  .convo-item:hover { background: var(--surface-hover); }
  .convo-item.active {
    background: var(--surface-hover);
    border-color: var(--accent);
  }
  .convo-item .title {
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .convo-item .del-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    padding: 0 2px;
    opacity: 0;
    transition: opacity 0.12s, color 0.12s;
    line-height: 1;
  }
  .convo-item:hover .del-btn { opacity: 1; }
  .convo-item .del-btn:hover { color: var(--red); }

  /* ── Main area ── */
  .main-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  .header {
    height: var(--header-h);
    min-height: var(--header-h);
    padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .header .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header .brand .logo {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1.5px;
    background: linear-gradient(135deg, var(--accent), var(--green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header .brand .subtitle {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }

  .header .model-selector {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header .model-selector label {
    font-size: 11px;
    color: var(--text-dim);
  }
  .header .model-selector select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 12px;
    padding: 4px 8px;
    cursor: pointer;
    outline: none;
  }
  .header .model-selector select:focus {
    border-color: var(--accent);
  }

  /* ── Messages ── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .message {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.6;
    font-size: 13px;
    position: relative;
  }
  .message.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #1a1a5a, #0d0d30);
    border: 1px solid #2a2a7a;
  }
  .message.assistant {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .message .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .message .content { white-space: pre-wrap; word-break: break-word; }
  .message .content p { margin-bottom: 8px; }
  .message .content p:last-child { margin-bottom: 0; }
  .message .content code {
    background: rgba(108, 108, 255, 0.15);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
    color: var(--accent);
  }
  .message .content pre {
    background: rgba(0, 0, 0, 0.4);
    padding: 12px;
    border-radius: var(--radius);
    overflow-x: auto;
    margin: 8px 0;
    font-size: 12px;
    border: 1px solid var(--border);
  }
  .message .content pre code { background: none; padding: 0; color: inherit; }
  .message.system {
    align-self: center;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--text-dim);
    font-size: 11px;
    text-align: center;
  }

  .typing-cursor::after {
    content: '▊';
    animation: blink 1s step-end infinite;
    color: var(--accent);
  }
  @keyframes blink { 50% { opacity: 0; } }

  .loading-dots::after {
    content: '...';
    animation: dots 1.5s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
  }

  .error-msg {
    color: var(--red);
    font-size: 11px;
    padding: 8px 12px;
    background: rgba(255, 74, 106, 0.1);
    border: 1px solid rgba(255, 74, 106, 0.3);
    border-radius: var(--radius);
    align-self: center;
    text-align: center;
  }

  /* ── Input area ── */
  #input-area {
    padding: 12px 20px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  #input-area textarea {
    flex: 1;
    resize: none;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 13px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    outline: none;
    min-height: 40px;
    max-height: 160px;
    line-height: 1.5;
  }
  #input-area textarea:focus { border-color: var(--accent); }
  #input-area textarea::placeholder { color: var(--text-dim); }
  #input-area button {
    padding: 10px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 12px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, box-shadow 0.15s;
    letter-spacing: 0.5px;
  }
  #input-area button:hover {
    background: #7a7aff;
    box-shadow: 0 0 16px var(--accent-glow);
  }
  #input-area button:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

  /* ── Status bar ── */
  .status-bar {
    height: var(--status-h);
    min-height: var(--status-h);
    padding: 0 16px;
    background: #050518;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }
  .status-bar .left, .status-bar .right {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .status-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .status-indicator .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
  }
  .status-indicator .dot.connected {
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
  }
  .status-indicator .dot.disconnected {
    background: var(--red);
    box-shadow: 0 0 6px var(--red);
  }
  .status-bar .model-name {
    font-size: 11px;
    color: var(--text-dim);
  }
  .status-bar .model-name span {
    color: var(--accent);
  }
  .status-bar .right .key-hint {
    font-size: 10px;
    color: var(--text-dim);
    opacity: 0.5;
  }

  /* ── Responsive ── */
  @media (max-width: 720px) {
    .sidebar { display: none; }
    .message { max-width: 95%; }
    #input-area { padding: 10px 12px; }
    .header .model-selector select { max-width: 120px; }
  }
</style>
</head>
<body>

<!-- Geometric SVG decorations -->
<svg class="bg-decor hex1" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <polygon points="50,0 93,25 93,75 50,100 7,75 7,25" fill="none" stroke="#6c6cff" stroke-width="0.5"/>
  <polygon points="50,12 81,31 81,69 50,88 19,69 19,31" fill="none" stroke="#4aff8a" stroke-width="0.3"/>
</svg>
<svg class="bg-decor hex2" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <polygon points="50,5 88,28 88,72 50,95 12,72 12,28" fill="none" stroke="#6c6cff" stroke-width="0.5"/>
</svg>
<svg class="bg-decor poly1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <polygon points="100,5 140,20 180,60 195,100 180,140 140,180 100,195 60,180 20,140 5,100 20,60 60,20" fill="none" stroke="#6c6cff" stroke-width="0.3"/>
  <polygon points="100,30 130,42 158,69 170,100 158,131 130,159 100,170 69,158 42,130 30,100 42,69 69,42" fill="none" stroke="#4aff8a" stroke-width="0.2"/>
</svg>

<!-- Header -->
<div class="header">
  <div class="brand">
    <span class="logo">NIGHTHAWK</span>
    <span class="subtitle">// terminal chat</span>
  </div>
  <div class="model-selector">
    <label for="model-select">model</label>
    <select id="model-select">
      <option value="nighthawk">nighthawk</option>
      <option value="nighthawk-pro">nighthawk-pro</option>
      <option value="gpt-4o">gpt-4o</option>
      <option value="claude-3-opus">claude-3-opus</option>
    </select>
  </div>
</div>

<div class="app-layout">

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>conversations</h2>
      <button class="new-btn" id="new-convo-btn">+ new</button>
    </div>
    <div class="convo-list" id="convo-list"></div>
  </div>

  <!-- Main chat area -->
  <div class="main-area">
    <div id="messages">
      <div class="message system">
        <div class="content">[ system ] connected to NightHawk API. send a message to begin.</div>
      </div>
    </div>

    <div id="input-area">
      <textarea id="input" rows="1" placeholder="type a message..." autofocus></textarea>
      <button id="send-btn">send</button>
    </div>
  </div>
</div>

<!-- Status bar -->
<div class="status-bar">
  <div class="left">
    <div class="status-indicator">
      <span class="dot connected" id="status-dot"></span>
      <span id="status-text">connected</span>
    </div>
    <div class="model-name">
      model: <span id="status-model">nighthawk</span>
    </div>
  </div>
  <div class="right">
    <span class="key-hint">ENTER to send · SHIFT+ENTER for newline</span>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ── State ── */
  const STORAGE_KEY = 'nighthawk-web.convos';
  const ACTIVE_KEY  = 'nighthawk-web.active-convo';
  let conversations = [];
  let activeId = null;
  let currentHistory = [{ role: 'system', content: 'You are a helpful assistant.' }];
  let isStreaming = false;

  /* ── DOM refs ── */
  const messagesEl    = document.getElementById('messages');
  const inputEl       = document.getElementById('input');
  const sendBtn       = document.getElementById('send-btn');
  const convoListEl   = document.getElementById('convo-list');
  const newConvoBtn   = document.getElementById('new-convo-btn');
  const modelSelect   = document.getElementById('model-select');
  const statusDot     = document.getElementById('status-dot');
  const statusText    = document.getElementById('status-text');
  const statusModel   = document.getElementById('status-model');

  /* ── Persistence ── */
  function saveConvos() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
  }
  function saveActive() {
    if (activeId) localStorage.setItem(ACTIVE_KEY, activeId);
    else localStorage.removeItem(ACTIVE_KEY);
  }
  function loadConvos() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      conversations = raw ? JSON.parse(raw) : [];
    } catch { conversations = []; }
    try {
      const id = localStorage.getItem(ACTIVE_KEY);
      activeId = id && conversations.some(c => c.id === id) ? id : null;
    } catch { activeId = null; }
    if (!activeId && conversations.length > 0) activeId = conversations[0].id;
  }

  /* ── Conversation helpers ── */
  function genId() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6); }

  function createConvo(title) {
    const id = genId();
    const convo = { id, title: title || 'new conversation', created: Date.now(), history: [{ role: 'system', content: 'You are a helpful assistant.' }] };
    conversations.unshift(convo);
    saveConvos();
    return convo;
  }

  function deleteConvo(id) {
    conversations = conversations.filter(c => c.id !== id);
    saveConvos();
    if (activeId === id) {
      if (conversations.length > 0) {
        activeId = conversations[0].id;
        loadConvo(activeId);
      } else {
        activeId = null;
        currentHistory = [{ role: 'system', content: 'You are a helpful assistant.' }];
        clearMessages();
        addSystemMsg('conversation deleted. start a new one.');
      }
      saveActive();
    }
    renderConvoList();
  }

  function loadConvo(id) {
    const convo = conversations.find(c => c.id === id);
    if (!convo) return;
    activeId = id;
    currentHistory = convo.history ? JSON.parse(JSON.stringify(convo.history)) : [{ role: 'system', content: 'You are a helpful assistant.' }];
    saveActive();
    clearMessages();
    for (const msg of currentHistory) {
      if (msg.role === 'user') addMessage('user', msg.content);
      else if (msg.role === 'assistant') addMessage('assistant', msg.content);
    }
    if (currentHistory.filter(m => m.role !== 'system').length === 0) {
      addSystemMsg('connected to NightHawk API. send a message to begin.');
    }
    renderConvoList();
  }

  function switchConvo(id) {
    if (isStreaming) return;
    loadConvo(id);
  }

  function newConvo() {
    if (isStreaming) return;
    const convo = createConvo('conversation ' + (conversations.length + 1));
    activeId = convo.id;
    currentHistory = JSON.parse(JSON.stringify(convo.history));
    saveActive();
    clearMessages();
    addSystemMsg('connected to NightHawk API. send a message to begin.');
    renderConvoList();
  }

  /* ── Render sidebar ── */
  function renderConvoList() {
    convoListEl.innerHTML = '';
    for (const c of conversations) {
      const item = document.createElement('div');
      item.className = 'convo-item' + (c.id === activeId ? ' active' : '');
      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = c.title;
      item.appendChild(title);
      const delBtn = document.createElement('button');
      delBtn.className = 'del-btn';
      delBtn.textContent = '×';
      delBtn.title = 'delete conversation';
      delBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteConvo(c.id); });
      item.appendChild(delBtn);
      item.addEventListener('click', () => switchConvo(c.id));
      convoListEl.appendChild(item);
    }
  }

  /* ── Message rendering ── */
  function clearMessages() {
    messagesEl.innerHTML = '';
  }

  function addMessage(role, content) {
    const el = document.createElement('div');
    el.className = 'message ' + role;
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = role === 'user' ? 'you' : 'nighthawk';
    el.appendChild(label);
    const contentEl = document.createElement('div');
    contentEl.className = 'content';
    contentEl.textContent = content;
    el.appendChild(contentEl);
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return contentEl;
  }

  function addSystemMsg(msg) {
    const el = document.createElement('div');
    el.className = 'message system';
    const contentEl = document.createElement('div');
    contentEl.className = 'content';
    contentEl.textContent = msg;
    el.appendChild(contentEl);
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addError(msg) {
    const el = document.createElement('div');
    el.className = 'error-msg';
    el.textContent = msg;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setLoading(loading) {
    sendBtn.disabled = loading;
    inputEl.disabled = loading;
    if (!loading) inputEl.focus();
  }

  /* ── SSE / typewriter streaming ── */
  function typewriterAppend(container, text, callback) {
    let i = 0;
    container.classList.add('typing-cursor');
    function tick() {
      if (i >= text.length) {
        container.classList.remove('typing-cursor');
        if (callback) callback();
        return;
      }
      const chunk = text.slice(i, i + 3);
      container.textContent += chunk;
      i += 3;
      messagesEl.scrollTop = messagesEl.scrollHeight;
      requestAnimationFrame(tick);
    }
    tick();
  }

  /* ── Send message ── */
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isStreaming) return;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    addMessage('user', text);
    currentHistory.push({ role: 'user', content: text });
    setLoading(true);
    isStreaming = true;

    const assistantContentEl = addMessage('assistant', '');
    assistantContentEl.textContent = '';

    const loadingSpan = document.createElement('span');
    loadingSpan.className = 'loading-dots';
    assistantContentEl.appendChild(loadingSpan);

    try {
      const model = modelSelect.value;
      const res = await fetch('/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model,
          messages: currentHistory,
          stream: true,
        }),
      });

      if (!res.ok) {
        const errBody = await res.text().catch(() => '');
        addError('request failed: ' + res.status + ' ' + res.statusText + (errBody ? ' — ' + errBody : ''));
        setLoading(false);
        isStreaming = false;
        currentHistory.pop();
        if (loadingSpan.parentNode) loadingSpan.parentNode.removeChild(loadingSpan);
        return;
      }

      // Update status bar with model
      statusModel.textContent = model;

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let fullContent = '';

      assistantContentEl.textContent = '';
      if (loadingSpan.parentNode) assistantContentEl.removeChild(loadingSpan);

      // Start typewriter
      assistantContentEl.classList.add('typing-cursor');

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value, { stream: true });
        const lines = chunk.split('\n');

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') continue;
          try {
            const parsed = JSON.parse(data);
            const delta = parsed.choices?.[0]?.delta?.content;
            if (delta) {
              fullContent += delta;
              assistantContentEl.textContent = fullContent;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
          } catch { /* skip malformed */ }
        }
      }

      assistantContentEl.classList.remove('typing-cursor');
      currentHistory.push({ role: 'assistant', content: fullContent });

      // Save to conversation
      const convo = conversations.find(c => c.id === activeId);
      if (convo) {
        convo.history = JSON.parse(JSON.stringify(currentHistory));
        // Update title from first user message
        const firstUser = currentHistory.find(m => m.role === 'user');
        if (firstUser && convo.title === 'new conversation') {
          convo.title = firstUser.content.slice(0, 40) + (firstUser.content.length > 40 ? '…' : '');
        }
        saveConvos();
        renderConvoList();
      }

    } catch (err) {
      addError('network error: ' + err.message);
      currentHistory.pop();
      assistantContentEl.classList.remove('typing-cursor');
    }

    setLoading(false);
    isStreaming = false;
  }

  /* ── Event listeners ── */
  sendBtn.addEventListener('click', sendMessage);

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = inputEl.scrollHeight + 'px';
  });

  newConvoBtn.addEventListener('click', newConvo);

  modelSelect.addEventListener('change', () => {
    statusModel.textContent = modelSelect.value;
  });

  /* ── Init ── */
  loadConvos();
  if (activeId) {
    loadConvo(activeId);
  } else {
    const convo = createConvo('conversation 1');
    activeId = convo.id;
    saveActive();
    renderConvoList();
  }

  inputEl.focus();
  statusModel.textContent = modelSelect.value;
})();
</script>
</body>
</html>
