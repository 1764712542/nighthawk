<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NightHawk Chat</title><style>
:root{--bg:#000013;--surface:#0a0a1a;--text:#f3f3f3;--dim:#888;--border:#1a1a3a;--primary:#f3f3f3;--accent:#6c6cff;--font:'Courier New',monospace}
*{margin:0;padding:0;box-sizing:border-box;font-family:var(--font)}
body{background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;font-size:14px}
#app{display:flex;height:100vh;width:100%}
#sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
#sidebar h2{padding:14px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:2px;border-bottom:1px solid var(--border)}
#conv-list{flex:1;overflow-y:auto;padding:6px}
.conv-item{padding:7px 10px;cursor:pointer;border-radius:3px;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;align-items:center}
.conv-item:hover{background:rgba(255,255,255,0.05);color:var(--text)}
.conv-item.active{background:rgba(108,108,255,0.15);color:var(--primary)}
.conv-item .del{color:var(--dim);font-size:10px;padding:2px 6px;border-radius:2px;cursor:pointer;display:none}
.conv-item:hover .del{display:inline}
.conv-item .del:hover{color:#ff4444;background:rgba(255,68,68,0.1)}
#new-btn{padding:10px;border-bottom:1px solid var(--border)}
#new-btn button{width:100%;padding:7px;background:transparent;border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:12px;border-radius:3px}
#new-btn button:hover{background:rgba(255,255,255,0.05)}
#main{flex:1;display:flex;flex-direction:column}
#header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
#header h1{font-size:14px;font-weight:normal}
#status{font-size:11px;color:var(--dim)}
#status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
#status .dot.on{background:#4aff8a}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:78%;padding:8px 12px;border-radius:3px;line-height:1.5;font-size:13px;white-space:pre-wrap;word-break:break-word;border:1px solid var(--border)}
.msg.user{background:rgba(108,108,255,0.08);align-self:flex-end;border-color:rgba(108,108,255,0.2)}
.msg.assistant{background:var(--surface);align-self:flex-start}
.msg .label{color:var(--dim);font-size:10px;margin-bottom:3px;text-transform:uppercase}
.msg code{background:rgba(255,255,255,0.05);padding:1px 3px;border-radius:2px;font-size:12px}
.msg pre{background:rgba(0,0,0,0.3);padding:8px;border-radius:3px;overflow-x:auto;margin:6px 0;font-size:12px;border:1px solid var(--border)}
#input-area{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end}
#inp{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:3px;font-size:13px;resize:none;outline:none;min-height:38px;max-height:180px;line-height:1.4}
#inp:focus{border-color:var(--accent)}
#send{padding:8px 16px;background:transparent;border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:12px;border-radius:3px;height:38px}
#send:hover{background:rgba(255,255,255,0.05);border-color:var(--accent)}
#send:disabled{opacity:0.3;cursor:not-allowed}
.cur{display:inline-block;width:7px;height:13px;background:var(--primary);animation:bk 1s step-end infinite;vertical-align:text-bottom;margin-left:2px}
@keyframes bk{50%{opacity:0}}
</style></head><body><div id="app">
<div id="sidebar"><div id="new-btn"><button onclick="nc()">+ NEW</button></div><h2>CHATS</h2><div id="conv-list"></div></div>
<div id="main"><div id="header"><h1>NIGHTHAWK</h1><span id="status"><span class="dot on"></span>Ready</span></div>
<div id="messages"></div>
<div id="input-area"><textarea id="inp" rows="1" placeholder="> type a message..." onkeydown="k(event)"></textarea><button id="send" onclick="s()">SEND</button></div></div></div>
<script>
const K='nhc';let C=JSON.parse(localStorage.getItem(K)||'[]');let A=C[0]?.id||null;let M=[];let B=false;
function L(){let e=document.getElementById('conv-list');e.innerHTML='';C.forEach(c=>{let d=document.createElement('div');d.className='conv-item'+(c.id===A?' active':'');d.innerHTML='<span>'+(c.t||'Chat')+'</span><span class="del" onclick="event.stopPropagation();dc(\''+c.id+'\')">×</span>';d.onclick=()=>sw(c.id);e.appendChild(d)});if(!A&&C.length===0)nc()}
function sv(){localStorage.setItem(K,JSON.stringify(C))}
function nc(){let id=Date.now().toString();C.unshift({id,t:'New Chat',m:[]});A=id;M=[];sv();L();R()}
function sw(id){A=id;let c=C.find(x=>x.id===id);M=c?.m||[];R()}
function dc(id){C=C.filter(x=>x.id!==id);if(A===id)A=C[0]?.id||M=[];M=[];sv();L();R()}
function R(){let e=document.getElementById('messages');e.innerHTML='';let c=C.find(x=>x.id===A);M=c?.m||[];M.forEach(m=>{a(m.r,m.c,false)});e.scrollTop=e.scrollHeight}
function a(r,c,save){let e=document.getElementById('messages');let d=document.createElement('div');d.className='msg '+r;d.innerHTML='<div class="label">'+(r==='user'?'> YOU':'< AI')+'</div><div class="c">'+h(c)+'</div>';e.appendChild(d);e.scrollTop=e.scrollHeight;if(save){let c2=C.find(x=>x.id===A);if(c2){c2.m.push({r, c});sv()}}}
function h(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}
function k(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();s()}}
async function s(){let inp=document.getElementById('inp');let t=inp.value.trim();if(!t||B)return;inp.value='';B=true;document.getElementById('send').disabled=true;a('user',t);let c=C.find(x=>x.id===A);if(c&&(!c.t||c.t==='New Chat')){c.t=t.slice(0,35);sv();L()}
let el=document.createElement('div');el.className='msg assistant';el.innerHTML='<div class="label">< AI</div><div class="c"><span class="cur"></span></div>';document.getElementById('messages').appendChild(el);let ce=el.querySelector('.c');let txt='';try{let r=await fetch('/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[...M.map(m=>({role:m.r,content:m.c})),{role:'user',content:t}],stream:false})});let d=await r.json();txt=d.choices?.[0]?.message?.content||'';ce.innerHTML=h(txt);let c2=C.find(x=>x.id===A);if(c2){c2.m.push({r:'assistant',c:txt});sv()}}catch(e){ce.innerHTML='<span style="color:#ff4444">Error: '+e.message+'</span>'}finally{B=false;document.getElementById('send').disabled=false;el.scrollIntoView({behavior:'smooth'})}}
L();R();
</script></body></html>
