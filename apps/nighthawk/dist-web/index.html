<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NightHawk</title>
<style>
:root{--bg:#000013;--surface:#0a0a1a;--card:#0d0d22;--text:#f3f3f3;--dim:#7a7a9a;--border:#1a1a3a;--accent:#6c6cff;--hover:rgba(108,108,255,0.1);--font:'Inter','SF Pro','Segoe UI',sans-serif;--mono:'JetBrains Mono','Fira Code',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);height:100vh;overflow:hidden}
#app{display:flex;height:100vh}
#sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
#sidebar-top{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
#sidebar-top .logo{width:32px;height:32px;border:1px solid var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--accent);font-family:var(--mono)}
#sidebar-top h2{font-size:15px;font-weight:600;letter-spacing:-0.3px}
#new-btn{padding:12px 16px}
#new-btn button{width:100%;padding:10px;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;cursor:pointer;font-size:13px;font-family:var(--font);transition:all 0.2s}
#new-btn button:hover{background:var(--hover);border-color:var(--accent)}
#conv-list{flex:1;overflow-y:auto;padding:8px}
.conv-item{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center;transition:all 0.15s}
.conv-item:hover{background:var(--hover)}
.conv-item.active{background:var(--hover);border-left:2px solid var(--accent)}
.conv-item .title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.conv-item .del{color:var(--dim);font-size:11px;padding:2px 6px;border-radius:4px;cursor:pointer;opacity:0;transition:all 0.15s}
.conv-item:hover .del{opacity:1}
.conv-item .del:hover{color:#ff4444;background:rgba(255,68,68,0.1)}
#sidebar-bottom{padding:12px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
#sidebar-bottom .status{display:flex;align-items:center;gap:6px}
#sidebar-bottom .dot{width:6px;height:6px;border-radius:50%}
#sidebar-bottom .dot.on{background:#4aff8a}
#main{flex:1;display:flex;flex-direction:column}
#header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#header h1{font-size:16px;font-weight:600}
#header select{padding:6px 10px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:12px;font-family:var(--font);cursor:pointer;outline:none}
#header select:focus{border-color:var(--accent)}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.ms{max-width:75%;padding:12px 16px;border-radius:10px;line-height:1.6;font-size:14px;white-space:pre-wrap;word-break:break-word;animation:fadeIn 0.2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.ms.user{background:rgba(108,108,255,0.12);align-self:flex-end;border-bottom-right-radius:4px}
.ms.assistant{background:var(--card);align-self:flex-start;border-bottom-left-radius:4px;border:1px solid var(--border)}
.ms .label{font-size:11px;color:var(--dim);margin-bottom:4px;font-weight:500}
.ms code{background:rgba(255,255,255,0.06);padding:2px 5px;border-radius:3px;font-size:13px;font-family:var(--mono)}
.ms pre{background:rgba(0,0,0,0.4);padding:12px;border-radius:6px;overflow-x:auto;margin:8px 0;font-size:13px;border:1px solid var(--border);font-family:var(--mono);line-height:1.4}
#input-area{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:12px;align-items:flex-end;background:var(--surface)}
#inp{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:8px;font-size:14px;resize:none;outline:none;min-height:44px;max-height:160px;line-height:1.5;font-family:var(--font);transition:border-color 0.2s}
#inp:focus{border-color:var(--accent)}
#inp::placeholder{color:var(--dim)}
#send{padding:10px 20px;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;cursor:pointer;font-size:13px;font-family:var(--font);height:44px;transition:all 0.2s;font-weight:500}
#send:hover{background:var(--hover);border-color:var(--accent);color:var(--accent)}
#send:disabled{opacity:0.3;cursor:not-allowed}
.cur{display:inline-block;width:7px;height:15px;background:var(--accent);animation:bk 0.8s step-end infinite;vertical-align:text-bottom;margin-left:2px;border-radius:1px}
@keyframes bk{50%{opacity:0}}
.load{display:flex;gap:4px;padding:4px 0}
.load span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bl 1.4s ease-in-out infinite}
.load span:nth-child(2){animation-delay:0.2s}
.load span:nth-child(3){animation-delay:0.4s}
@keyframes bl{0%,80%,100%{opacity:0.3;transform:scale(0.8)}40%{opacity:1;transform:scale(1)}}
</style></head><body>
<div id="app">
<div id="sidebar">
<div id="sidebar-top"><div class="logo">NH</div><h2>NightHawk</h2></div>
<div id="new-btn"><button onclick="nc()">+ New Chat</button></div>
<div id="conv-list"></div>
<div id="sidebar-bottom"><span class="status"><span class="dot on"></span>Connected</span><span>v0.41.0</span></div>
</div>
<div id="main">
<div id="header"><h1>NightHawk</h1><select id="model" onchange="sv()"><option value="nighthawk">nighthawk</option></select></div>
<div id="messages"><div class="ms assistant" style="max-width:90%;text-align:center;border:none;background:transparent;padding:40px 20px"><div style="font-size:28px;font-weight:700;letter-spacing:-1px;margin-bottom:8px;color:var(--accent)">NightHawk</div><div style="color:var(--dim);font-size:14px">AI-powered terminal coding agent</div><div style="margin-top:20px;font-size:13px;color:var(--dim)">Type a message to start a conversation</div></div></div>
<div id="input-area"><textarea id="inp" rows="1" placeholder="Type a message..." onkeydown="k(event)"></textarea><button id="send" onclick="s()">Send</button></div>
</div></div>
<script>
const K='nhc2';let C=JSON.parse(localStorage.getItem(K)||'[]');let A=C[0]?.id||null;let M=[];let B=false;
function L(){let e=document.getElementById('conv-list');e.innerHTML='';C.forEach(c=>{let d=document.createElement('div');d.className='conv-item'+(c.id===A?' active':'');let t=document.createElement('span');t.className='title';t.textContent=c.t||'New Chat';d.appendChild(t);let x=document.createElement('span');x.className='del';x.textContent='×';x.onclick=e=>{e.stopPropagation();dc(c.id)};d.appendChild(x);d.onclick=()=>sw(c.id);e.appendChild(d)});if(!A&&C.length===0)nc()}
function sv(){localStorage.setItem(K,JSON.stringify(C))}
function nc(){let id=Date.now().toString();C.unshift({id,t:'New Chat',m:[]});A=id;M=[];sv();L();R()}
function sw(id){A=id;let c=C.find(x=>x.id===id);M=c?.m||[];document.getElementById('messages').innerHTML='';R()}
function dc(id){C=C.filter(x=>x.id!==id);if(A===id)A=C[0]?.id||null;M=[];sv();L();R()}
function R(){let e=document.getElementById('messages');e.innerHTML='';let c=C.find(x=>x.id===A);M=c?.m||[];M.forEach(m=>{a(m.r,m.c,false)});e.scrollTop=e.scrollHeight}
function a(r,c,save){let e=document.getElementById('messages');let d=document.createElement('div');d.className='ms '+r;d.innerHTML='<div class="label">'+(r==='user'?'> You':'< Assistant')+'</div>'+h(c);e.appendChild(d);e.scrollTop=e.scrollHeight;if(save){let c2=C.find(x=>x.id===A);if(c2){c2.m.push({r,c});sv()}}}
function h(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>').replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>')}
function k(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();s()}}
async function s(){let inp=document.getElementById('inp');let t=inp.value.trim();if(!t||B)return;inp.value='';B=true;document.getElementById('send').disabled=true;a('user',t);let c=C.find(x=>x.id===A);if(c&&(!c.t||c.t==='New Chat')){c.t=t.slice(0,35);sv();L()}
let el=document.createElement('div');el.className='ms assistant';el.innerHTML='<div class="label">< Assistant</div><div class="load"><span></span><span></span><span></span></div>';document.getElementById('messages').appendChild(el);let txt='';try{let r=await fetch('/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[...M.map(m=>({role:m.r,content:m.c})),{role:'user',content:t}],stream:false})});let d=await r.json();txt=d.choices?.[0]?.message?.content||'';el.innerHTML='<div class="label">< Assistant</div>'+h(txt);let c2=C.find(x=>x.id===A);if(c2){c2.m.push({r:'assistant',c:txt});sv()}}catch(e){el.innerHTML='<div class="label">< Assistant</div><span style="color:#ff4444">Error: '+(e.message||'Connection failed')+'</span>'}finally{B=false;document.getElementById('send').disabled=false;el.scrollIntoView({behavior:'smooth'})}}
L();R();
</script></body></html>
